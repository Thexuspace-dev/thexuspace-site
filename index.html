<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheXuSpace</title>
<meta name="description" content="TheXuSpace — photography and visual/audio work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0c0a; --text:#f5f0e8; --text-dim:#b8ab98;
    --accent:#a97d4f; --ease:cubic-bezier(0.65,0,0.35,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',Arial,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  h1,h2{font-family:'Fraunces',serif;letter-spacing:-.01em;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--accent);color:#fff;}

  header.nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:20px clamp(20px,5vw,56px);}
  .nav-logo{font-family:'Fraunces',serif;font-weight:600;font-size:16px;letter-spacing:.02em;}
  .nav-links{display:none;gap:26px;font-size:13px;color:var(--text-dim);}
  @media(min-width:800px){.nav-links{display:flex;}}
  .nav-links a{transition:color .3s var(--ease);}
  .nav-links a:hover{color:var(--text);}

  #hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;}
  /* Soft light-blue blurred color field instead of a photo — a few
     overlapping radial gradients, blurred and scaled up slightly past
     the edges so the blur filter has no hard edge to reveal. */
  #hero .bg{position:absolute;inset:-10%;background:radial-gradient(circle at 28% 22%, #cfe9fa 0%, transparent 55%), radial-gradient(circle at 78% 68%, #9cc9ea 0%, transparent 55%), linear-gradient(160deg, #d8eef9, #a7cfec);filter:blur(70px);opacity:.55;}
  #hero .scrim{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%, rgba(14,12,10,.35), rgba(14,12,10,.92) 75%);}
  .hero-inner{position:relative;z-index:2;padding:0 24px;}
  .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:22px;}
  h1.name{font-size:clamp(38px,7vw,72px);font-weight:600;margin-bottom:16px;}
  .tagline{font-size:clamp(14px,1.6vw,18px);color:var(--text-dim);max-width:520px;margin:0 auto 40px;line-height:1.7;}

  .rooms{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .room{border:1px solid rgba(245,240,232,.25);padding:14px 26px;border-radius:2px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;transition:all .3s var(--ease);}
  .room:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);}

  footer{padding:36px 24px;text-align:center;font-size:12px;color:var(--text-dim);}
  footer a{color:var(--accent);}

  .reveal{opacity:0;transform:translateY(24px);}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-logo">TheXuSpace</div>
  <div class="nav-links">
    <a href="photography.html">Photography</a>
    <a href="visual-audio.html">Visual &amp; Audio</a>
  </div>
</header>

<section id="hero">
  <div class="bg"></div>
  <div class="scrim"></div>
  <div class="hero-inner">
    <h1 class="name reveal">TheXuSpace</h1>
    <div class="rooms reveal">
      <a class="room" href="photography.html">Photography</a>
      <a class="room" href="visual-audio.html">Visual &amp; Audio</a>
    </div>
  </div>
</section>

<footer>
  TheXuSpace
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  gsap.to('.reveal', { opacity:1, y:0, duration:0.9, ease:'power3.out', stagger:0.12, delay:0.2 });
</script>
</body>
</html>
