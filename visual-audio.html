<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual &amp; Audio — TheXuSpace</title>
<meta name="description" content="Visual & Audio — live audio-reactive visuals, TheXuSpace.">
<style>
  :root{ --bg:#050505; --text:#f2f2f2; --text-dim:#8a8a8a; --accent:#8C0809; --void:#2A0048; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);overflow:hidden;}
  body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  header.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px clamp(20px,5vw,56px);mix-blend-mode:difference;transition:opacity .5s ease;}
  header.nav.faded:not(:hover){opacity:.3;}
  .nav-logo{font-weight:700;font-size:15px;letter-spacing:.04em;}
  .nav-links{display:none;gap:22px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;}
  @media(min-width:800px){.nav-links{display:flex;}}
  .nav-links a.current{color:var(--accent);}

  canvas{position:fixed;inset:0;z-index:1;display:block;}

  #gate{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;background:var(--bg);transition:opacity .8s ease;padding:24px;}
  #gate .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);}
  #gate h1{font-size:clamp(26px,5vw,44px);font-weight:800;letter-spacing:-.02em;}
  #gate p{max-width:620px;color:var(--text-dim);font-size:17px;line-height:1.7;opacity:.9;}
  #enterBtn{border:1.5px solid var(--text);color:var(--text);background:none;padding:16px 38px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .25s ease;}
  #enterBtn:hover{background:var(--accent);border-color:var(--accent);color:#0a0a0a;}
  #gate.hidden{opacity:0;pointer-events:none;}

  /* Always-visible floating "sets" widget, sitting at a flat 70% opacity
     baseline (not hidden behind a toggle button anymore) — hover brings
     it to full strength, and it dips further while audio is audibly
     playing, same fade language as the rest of the transport chrome. */
  #trackPanel{position:fixed;top:88px;left:clamp(16px,4vw,44px);z-index:16;width:200px;max-height:60vh;overflow-y:auto;background:rgba(10,10,10,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .5s ease,transform .5s ease;}
  #trackPanel.show{opacity:.7;transform:translateY(0);pointer-events:auto;}
  #trackPanel.show:hover{opacity:1;}
  #trackPanel.show.faded:not(:hover){opacity:.22;}
  #trackPanel .panel-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);padding:6px 8px 8px;}
  .track-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 8px;border-radius:4px;border:none;border-left:2px solid transparent;background:none;color:var(--text-dim);cursor:pointer;font-size:13px;transition:all .2s ease;}
  .track-item:hover{background:rgba(255,255,255,.06);color:var(--text);}
  .track-item.active{color:var(--text);border-left-color:var(--accent);background:rgba(140,8,9,.12);}
  .track-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex:none;}
  .track-item.active .dot{opacity:1;color:var(--accent);}

  #bar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px clamp(16px,4vw,40px);background:linear-gradient(0deg, rgba(5,5,5,.92), rgba(5,5,5,0));opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .6s ease;}
  #bar.show{opacity:1;transform:translateY(0);}
  #bar.show.faded:not(:hover){opacity:.3;}
  #playBtn{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:none;color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:border-color .2s ease,color .2s ease;}
  #playBtn:hover{border-color:var(--accent);color:var(--accent);}
  #muteBtn{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(255,255,255,.25);background:none;color:var(--text-dim);cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase;transition:border-color .2s ease,color .2s ease;}
  #muteBtn:hover{border-color:var(--accent);color:var(--accent);}
  .time{font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums;flex:none;width:38px;}
  .time.right{text-align:right;}
  #seek{flex:1;position:relative;height:20px;display:flex;align-items:center;cursor:pointer;}
  #seek .track{position:relative;width:100%;height:3px;background:rgba(255,255,255,.18);border-radius:2px;}
  #seek .fill{position:absolute;top:0;left:0;height:100%;width:0%;background:var(--accent);border-radius:2px;}
  #seek .thumb{position:absolute;top:50%;left:0%;width:11px;height:11px;border-radius:50%;background:var(--text);transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(5,5,5,.4);}
  #nowPlaying{flex:none;max-width:220px;font-size:12px;color:var(--text-dim);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #nowPlaying b{color:var(--text);font-weight:600;}

  @media(max-width:640px){
    #nowPlaying{display:none;}
    #trackPanel{width:180px;}
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-logo"><a href="index.html">TheXuSpace</a></div>
  <div class="nav-links">
    <a href="photography.html">Photography</a>
    <a href="visual-audio.html" class="current">Visual &amp; Audio</a>
  </div>
</header>

<canvas id="viz"></canvas>

<div id="trackPanel">
  <div class="panel-label">Sets</div>
  <div id="trackList"></div>
</div>

<div id="gate">
  <h1>Visual &amp; Audio</h1>
  <p>A space to slow down and listen. Recorded sets paired with visuals that move with the music in real time, so you can just sit with it. Pick a set, watch it dance.</p>
  <button id="enterBtn">▶ Enter</button>
  <p style="font-size:13px;color:#555;opacity:.9;">Headphones recommended</p>
</div>

<div id="bar">
  <button id="playBtn">▶</button>
  <span class="time" id="curTime">0:00</span>
  <div id="seek">
    <div class="track">
      <div class="fill" id="seekFill"></div>
      <div class="thumb" id="seekThumb"></div>
    </div>
  </div>
  <span class="time right" id="durTime">0:00</span>
  <button id="muteBtn" title="Mute/Unmute">Mute</button>
  <div id="nowPlaying">Now Playing — <b id="nowPlayingName">Select a set</b></div>
</div>

<script>
(function(){
  const canvas = document.getElementById('viz');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
  resize(); addEventListener('resize', resize);

  // ---- Set list — add new recorded sets here as they're uploaded ----
  // "style" picks the visualizer treatment: 'ring' is the original red
  // pulsing circle, 'blackhole' is the void/purple treatment.
  const TRACKS = [
    { file: '72626.mp3', name: '0726 RC1', style: 'ring' },
    { file: '0826 RC2.m4a', name: '0817 RC2', style: 'blackhole' }
  ];
  let currentStyle = 'ring';

  const navHeader = document.querySelector('header.nav');
  const gate = document.getElementById('gate');
  const enterBtn = document.getElementById('enterBtn');
  const bar = document.getElementById('bar');
  const muteBtn = document.getElementById('muteBtn');
  const playBtn = document.getElementById('playBtn');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');
  const seek = document.getElementById('seek');
  const seekFill = document.getElementById('seekFill');
  const seekThumb = document.getElementById('seekThumb');
  const nowPlayingName = document.getElementById('nowPlayingName');
  const trackPanel = document.getElementById('trackPanel');
  const trackListEl = document.getElementById('trackList');

  let audioCtx, analyser, freqData, masterGain, muted = false;
  let el = null;
  let mediaSrc = null;
  let usingRealSet = false;
  let currentTrackIndex = -1;
  let trimStart = 0;
  let draggingSeek = false;

  // ===================== Audio graph =====================
  function initAudioGraph(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.7;
    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  // Detect leading silence by decoding just the first chunk of the file
  // (fast — avoids decoding an entire hour-long set into memory).
  async function detectLeadingSilence(url){
    try{
      const res = await fetch(url, { headers: { Range: 'bytes=0-1500000' }, cache: 'no-store' });
      if(!(res.ok || res.status === 206)) return 0;
      const buf = await res.arrayBuffer();
      const decoded = await audioCtx.decodeAudioData(buf.slice(0));
      const data = decoded.getChannelData(0);
      const sr = decoded.sampleRate;
      const threshold = 0.02;
      const win = Math.max(1, Math.floor(sr * 0.05));
      for(let i = 0; i < data.length - win; i += win){
        let sum = 0;
        for(let j = i; j < i + win; j++) sum += Math.abs(data[j]);
        if(sum / win > threshold){
          return Math.max(0, (i / sr) - 0.05);
        }
      }
      return 0;
    }catch(e){
      return 0;
    }
  }

  async function hasRealSet(file){
    try{
      const res = await fetch(encodeURI(file), { method: 'HEAD', cache: 'no-store' });
      return res.ok;
    }catch(e){ return false; }
  }

  function fmtTime(s){
    if(!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function updateSeekUI(){
    if(!el || !usingRealSet) return;
    const dur = Math.max(0.001, (el.duration || 0) - trimStart);
    const cur = Math.max(0, el.currentTime - trimStart);
    const frac = Math.min(1, Math.max(0, cur / dur));
    seekFill.style.width = (frac * 100) + '%';
    seekThumb.style.left = (frac * 100) + '%';
    curTimeEl.textContent = fmtTime(cur);
    durTimeEl.textContent = isFinite(el.duration) ? fmtTime(dur) : '0:00';
  }

  function renderTrackList(){
    trackListEl.innerHTML = '';
    TRACKS.forEach((t, i) => {
      const btn = document.createElement('button');
      btn.className = 'track-item' + (i === currentTrackIndex ? ' active' : '');
      btn.innerHTML = '<span class="dot"></span><span>' + t.name + '</span>';
      btn.addEventListener('click', () => loadTrack(i, true));
      trackListEl.appendChild(btn);
    });
  }

  async function loadTrack(index, autoplay){
    const t = TRACKS[index];
    if(!t) return;
    currentTrackIndex = index;
    currentStyle = t.style || 'ring';
    renderTrackList();
    nowPlayingName.textContent = t.name;

    // Stop absolutely everything that could be making sound before the
    // new track starts — the previous media source and audio element —
    // so two sources can never overlap.
    if(mediaSrc){ try{ mediaSrc.disconnect(); }catch(e){} mediaSrc = null; }
    if(el){ el.pause(); el.src = ''; el = null; }
    usingRealSet = false;

    const exists = await hasRealSet(t.file);
    if(!exists){
      nowPlayingName.textContent = t.name + ' (file not found)';
      refreshPlayingState();
      return;
    }

    trimStart = await detectLeadingSilence(encodeURI(t.file));

    el = new Audio(encodeURI(t.file));
    el.crossOrigin = 'anonymous';
    el.preload = 'auto';
    mediaSrc = audioCtx.createMediaElementSource(el);
    mediaSrc.connect(masterGain);
    usingRealSet = true;

    el.addEventListener('loadedmetadata', () => {
      if(trimStart > 0 && trimStart < el.duration) el.currentTime = trimStart;
      updateSeekUI();
    });
    el.addEventListener('timeupdate', () => { if(!draggingSeek) updateSeekUI(); });
    el.addEventListener('play', refreshPlayingState);
    el.addEventListener('pause', refreshPlayingState);
    el.addEventListener('ended', () => { playBtn.textContent = '▶'; refreshPlayingState(); });

    if(autoplay){
      el.play();
      playBtn.textContent = '❚❚';
    }
    refreshPlayingState();
  }

  // Fades the top nav + bottom transport bar to 30% while music is audibly
  // playing; hovering either bar (or pausing/muting) brings it back.
  function isAudioAudible(){
    return usingRealSet && el && !el.paused && !muted;
  }
  function refreshPlayingState(){
    const playing = isAudioAudible();
    navHeader.classList.toggle('faded', playing);
    bar.classList.toggle('faded', playing);
    trackPanel.classList.toggle('faded', playing);
  }

  // Sets up the audio graph and renders the sets list, but does NOT pick
  // or play a track — entering the page should never start audio on its
  // own. Playback only begins once the person clicks a set or hits play.
  async function initAudio(){
    initAudioGraph();
    renderTrackList();
  }

  enterBtn.addEventListener('click', async () => {
    await initAudio();
    gate.classList.add('hidden');
    bar.classList.add('show');
    trackPanel.classList.add('show');
    draw();
  });

  playBtn.addEventListener('click', () => {
    if(currentTrackIndex === -1){
      // Nothing picked yet — default to the first set.
      loadTrack(0, true);
      return;
    }
    if(usingRealSet && el){
      if(el.paused){ el.play(); playBtn.textContent = '❚❚'; }
      else { el.pause(); playBtn.textContent = '▶'; }
    }
    refreshPlayingState();
  });

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    if(masterGain) masterGain.gain.value = muted ? 0 : 0.7;
    muteBtn.textContent = muted ? 'Unmute' : 'Mute';
    refreshPlayingState();
  });

  function seekToClientX(clientX){
    if(!el || !usingRealSet) return;
    const rect = seek.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    const dur = Math.max(0.001, el.duration - trimStart);
    el.currentTime = trimStart + frac * dur;
    updateSeekUI();
  }
  seek.addEventListener('pointerdown', (e) => {
    draggingSeek = true;
    seekToClientX(e.clientX);
    seek.setPointerCapture(e.pointerId);
  });
  seek.addEventListener('pointermove', (e) => {
    if(draggingSeek) seekToClientX(e.clientX);
  });
  seek.addEventListener('pointerup', (e) => {
    draggingSeek = false;
    try{ seek.releasePointerCapture(e.pointerId); }catch(err){}
  });

  // ===================== "Black hole" visualizer =====================
  // A void at the center (void purple #2A0048 glow around a solid black
  // event horizon) with a sparse field of streaks falling inward, like
  // light being pulled past the horizon — reads as both a black hole and
  // a continuous dolly-zoom pull toward the center. Far fewer elements
  // than the old particle rings, on purpose, so it reads as spacious
  // rather than busy.
  const STREAK_COUNT = 42;
  let streaks = null;
  function initStreaks(baseR){
    streaks = [];
    for(let i=0;i<STREAK_COUNT;i++){
      streaks.push({
        angle: Math.random() * Math.PI * 2,
        radius: baseR * (1.6 + Math.random() * 2.2),
        speed: 0.55 + Math.random() * 1.1,
        len: 40 + Math.random() * 90,
        phase: Math.random() * Math.PI * 2
      });
    }
  }
  function drawStreaks(cx, cy, baseR, t, bass, mid, treble){
    if(!streaks) initStreaks(baseR);
    const outerR = baseR * 3.9;
    const innerR = baseR * 0.95;
    for(let i=0;i<streaks.length;i++){
      const s = streaks[i];
      // Pulled inward continuously, faster with more bass energy — the
      // core "falling into the void" motion.
      s.radius -= s.speed * (0.6 + bass * 2.4 + mid * 0.6);
      if(s.radius < innerR){
        s.radius = outerR;
        s.angle = Math.random() * Math.PI * 2;
      }
      // A tiny, fast vibration on top of the fall, so each streak reads
      // as trembling rather than perfectly smooth.
      const vibrate = Math.sin(t * 60 + s.phase) * 0.006;
      const drawAngle = s.angle + vibrate;
      // Stretched much longer and more dramatic than the original stubby
      // marks, so each one reads as a real streak of light being pulled in.
      const streakLen = s.len * (0.8 + treble * 1.8);
      const x1 = cx + Math.cos(drawAngle) * s.radius;
      const y1 = cy + Math.sin(drawAngle) * s.radius;
      const x2 = cx + Math.cos(drawAngle) * (s.radius + streakLen);
      const y2 = cy + Math.sin(drawAngle) * (s.radius + streakLen);
      const fade = Math.min(1, (s.radius - innerR) / (baseR * 1.2));
      const grad = ctx.createLinearGradient(x1, y1, x2, y2);
      grad.addColorStop(0, `rgba(225,195,255,${0.08 + fade*0.22 + treble*0.3})`);
      grad.addColorStop(1, `rgba(200,140,255,0)`);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1 + treble * 1.6;
      ctx.stroke();
    }
  }

  // ===================== Original "ring" visualizer (track 1) =====================
  // The very first look: a pulsing red circle, a rotating ring of white
  // particles, and a thin frequency-outline ring. Untouched from the
  // original build — restored as its own function, exclusive to track 1.
  function drawRingStyle(cx, cy, baseR, t, bass, mid, treble){
    ctx.fillStyle = 'rgba(5,5,5,0.28)';
    ctx.fillRect(0,0,W,H);

    const r = baseR + bass * baseR * 1.8;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(140,8,9,${0.35 + bass*0.5})`;
    ctx.lineWidth = 2 + bass*6;
    ctx.stroke();

    const n = 48;
    for(let i=0;i<n;i++){
      const a = (i/n) * Math.PI*2 + t;
      const rad = baseR * 2.1 + mid * 120 + Math.sin(a*3 + t*2) * treble * 60;
      const x = cx + Math.cos(a) * rad;
      const y = cy + Math.sin(a) * rad;
      const size = 1.5 + treble * 5;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${0.15 + treble*0.6})`;
      ctx.fill();
    }

    ctx.beginPath();
    for(let i=0;i<freqData.length;i++){
      const a2 = (i/freqData.length) * Math.PI*2;
      const rad2 = baseR*3.2 + (freqData[i]/255) * 90;
      const x2 = cx + Math.cos(a2) * rad2;
      const y2 = cy + Math.sin(a2) * rad2;
      if(i===0) ctx.moveTo(x2,y2); else ctx.lineTo(x2,y2);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(140,8,9,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // ===================== "Black hole" visualizer (track 2) =====================
  function drawBlackHoleStyle(cx, cy, baseR, t, bass, mid, treble){
    // Trail fill tinted toward the void purple instead of flat black, so
    // the whole scene carries the color even between frames.
    ctx.fillStyle = 'rgba(8,3,14,0.30)';
    ctx.fillRect(0,0,W,H);

    // Dolly-zoom pulse: scale the whole scene around center, snapping out
    // on a bass hit and easing back — a subtle push/pull "camera" motion
    // rather than a literal lens effect.
    if(bass > zoomEnvelope){ zoomEnvelope = bass; } else { zoomEnvelope *= 0.90; }
    const zoomScale = 1 + zoomEnvelope * 0.11;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(zoomScale, zoomScale);
    ctx.translate(-cx, -cy);

    drawStreaks(cx, cy, baseR, t, bass, mid, treble);

    // Event horizon: solid black core with a void-purple glow field behind it.
    const horizonR = baseR * 0.85 + bass * baseR * 0.45;
    const glow = ctx.createRadialGradient(cx, cy, horizonR*0.55, cx, cy, horizonR*1.9);
    glow.addColorStop(0, 'rgba(0,0,0,1)');
    glow.addColorStop(0.5, 'rgba(0,0,0,1)');
    glow.addColorStop(0.75, `rgba(160,30,225,${0.5 + bass*0.4})`);
    glow.addColorStop(1, 'rgba(160,30,225,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, horizonR*1.9, 0, Math.PI*2);
    ctx.fillStyle = glow;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, horizonR, 0, Math.PI*2);
    ctx.fillStyle = '#000';
    ctx.fill();

    // Inner ring — 45% base opacity, layered strokes stepping down in radius
    // and fading out to fake a motion blur pulling inward toward the core.
    ctx.save();
    ctx.shadowBlur = 18 + bass*20;
    ctx.shadowColor = 'rgba(215,70,255,0.9)';
    const innerSteps = 5;
    for(let i=0;i<innerSteps;i++){
      const step = i / (innerSteps-1);
      const r = horizonR * (1 - step*0.18);
      const a = 0.45 * (1 - step) + bass*0.15;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(225,100,255,${a})`;
      ctx.lineWidth = 2.2 - step*1.2;
      ctx.stroke();
    }
    ctx.restore();

    // Outer ring — layered strokes stepping up in radius and fading out to
    // fake a motion blur pulling outward, saturated blacklight neon glow.
    ctx.save();
    ctx.shadowBlur = 24 + bass*26;
    ctx.shadowColor = 'rgba(185,85,255,1)';
    const outerSteps = 6;
    for(let i=0;i<outerSteps;i++){
      const step = i / (outerSteps-1);
      const r = horizonR * (1.1 + step*0.36) + bass*baseR*0.3;
      const a = (0.55 + bass*0.4) * (1 - step*0.85);
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(205,120,255,${a})`;
      ctx.lineWidth = 2.6 - step*1.6;
      ctx.stroke();
    }
    ctx.restore();

    ctx.restore(); // matches the zoom-scale save() above
  }

  let wordEnvelope = 0; // fast attack, slow decay — gives the wordmark a trailing fade instead of flickering per-frame
  let zoomEnvelope = 0; // same fast-attack/slow-decay shape, drives the dolly-zoom push on bass hits (black hole style only)
  function draw(){
    requestAnimationFrame(draw);
    if(!analyser) return;
    analyser.getByteFrequencyData(freqData);

    const bass = avg(freqData, 0, 8) / 255;
    const mid  = avg(freqData, 8, 40) / 255;
    const treble = avg(freqData, 40, 100) / 255;

    const cx = W/2, cy = H/2;
    const baseR = Math.min(W,H) * 0.14;
    const t = performance.now() * 0.0004;

    const isBlackhole = currentStyle === 'blackhole';
    if(isBlackhole){
      drawBlackHoleStyle(cx, cy, baseR, t, bass, mid, treble);
    } else {
      drawRingStyle(cx, cy, baseR, t, bass, mid, treble);
    }

    // Center wordmark — accent red, with a fade-delay envelope: it snaps up
    // fast on a bass hit, then eases back down slowly instead of flickering
    // frame to frame with the raw signal. Base opacity is 70% on the ring
    // style (track 1, untouched) and 85% on the black hole style (track 2),
    // so the wordmark reads as the dominant "main character" over the ring.
    if(bass > wordEnvelope){
      wordEnvelope = bass;
    } else {
      wordEnvelope *= 0.94;
    }
    const wordBaseAlpha = isBlackhole ? 0.85 : 0.7;
    const wordAlpha = wordBaseAlpha * (0.5 + 0.5 * wordEnvelope);
    const wordSize = Math.min(W, H) * (0.075 + wordEnvelope * 0.012);
    ctx.save();
    ctx.font = `800 ${wordSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = `rgba(140,8,9,${wordAlpha})`;
    if(isBlackhole){
      // Constant dolly-zoom pulse on the wordmark itself: a continuous sine
      // scale, always running (not gated by bass), anchored at its own
      // center so it grows/shrinks as if approaching the viewer without
      // actually moving position. Black hole style only — track 1's
      // wordmark stays exactly as it was.
      const dolly = 1 + Math.sin(t * 3.2) * 0.07;
      ctx.translate(cx, cy);
      ctx.scale(dolly, dolly);
      ctx.translate(-cx, -cy);
    }
    ctx.fillText('THEXUSPACE', cx, cy);
    ctx.restore();
  }
  function avg(arr, start, end){
    let s=0; for(let i=start;i<end;i++) s += arr[i];
    return s / (end-start);
  }

  ctx.fillStyle = '#050505';
  ctx.fillRect(0,0,W,H);
})();
</script>
</body>
</html>
